[package]
name = "tetrino"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
egui = "0.29"
egui-winit = "0.29"
egui-wgpu = { version = "0.29", features = ["winit", "x11"] }
wgpu = "22"
pollster = "0.4"
rand = "0.8"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
image = "0.25"
rfd = "0.17"
bincode = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
